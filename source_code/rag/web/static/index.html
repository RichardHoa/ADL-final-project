<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Handbook Chatbot</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Conversations and documents">
      <header class="sidebar__header">
        <h1 class="brand">Handbook Chatbot</h1>
        <button type="button" class="button button--primary" id="new-chat">New chat</button>
      </header>

      <section class="panel" aria-labelledby="conversations-heading">
        <h2 class="panel__title" id="conversations-heading">Conversations</h2>
        <ul class="list" id="conversations"></ul>
        <p class="hint" id="conversations-empty" hidden>No conversations yet.</p>
      </section>

      <section class="panel" aria-labelledby="documents-heading">
        <h2 class="panel__title" id="documents-heading">Documents</h2>
        <ul class="list" id="documents"></ul>
        <p class="hint" id="documents-empty" hidden>No documents ingested yet.</p>
        <label class="button upload">
          Upload PDF or TXT
          <input type="file" class="upload__input" id="upload" accept=".pdf,.txt,application/pdf,text/plain">
        </label>
        <p class="hint" id="upload-status" role="status"></p>
        <p class="error" id="upload-error" role="alert"></p>
      </section>
    </aside>

    <main class="chat">
      <h2 class="chat__title" id="chat-title">New chat</h2>
      <ol class="messages" id="messages" aria-live="polite" aria-labelledby="chat-title"></ol>
      <p class="hint chat__empty" id="chat-empty">Ask a question about the documents in the knowledge base.</p>
      <p class="thinking" id="thinking" role="status" hidden>Thinking…</p>
      <form class="composer" id="composer">
        <label class="visually-hidden" for="question">Question</label>
        <textarea class="composer__input" id="question" rows="2" placeholder="Ask about the handbook…" required></textarea>
        <button type="submit" class="button button--primary" id="ask">Ask</button>
      </form>
    </main>
  </div>
</body>
</html>
